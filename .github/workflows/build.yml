name: build

# Every push builds signed installers. Pushing a version tag
# (git tag v0.2.0 && git push origin v0.2.0) also publishes them as a GitHub
# Release, together with the latest.json manifest that installed copies of
# BeamLink poll to update themselves.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    # Needs the signing key secret, which pull requests from forks don't get.
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            # `app` produces the .app.tar.gz the updater downloads.
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --bundles ${{ matrix.bundles }}
          # Empty on branch builds: build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: BeamLink ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download `BeamLink_*_x64-setup.exe` and run it. The installer sets up BeamMP in BeamNG.drive for you. Installed copies update themselves.
            **Linux:** `.AppImage` (self-updating) or `.deb`. **macOS:** `.dmg` (browse-only; BeamNG.drive doesn't run on macOS).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        with:
          name: beamlink-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
