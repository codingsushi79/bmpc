[package]
name = "beamlink"
version = "0.1.0"
description = "BeamLink — a BeamMP launcher with a server browser, built on the official BeamMP-Launcher"
edition = "2024"
license = "MIT"

[lib]
name = "beamlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
